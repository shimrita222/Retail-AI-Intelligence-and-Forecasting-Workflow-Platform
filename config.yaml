# Retail AI Intelligence & Forecasting Workflow Platform
# Local configuration: authentication, roles, and system paths.
# NOTE: passwords below are stored as SHA-256 hex digests (see src/utils/auth.py).
# Default password for every seeded account is the username itself, e.g. user "admin" -> password "admin123".

paths:
  data_raw_dir: "data/raw"
  artifacts_dir: "artifacts"
  dataset_manifest: "data/dataset_manifest.json"
  required_source_files:
    - "stores.csv"
    - "features.csv"
    - "train.csv"

credentials:
